name: Build and Release Desktop App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Get version from app.csproj
        id: get_version
        shell: pwsh
        run: |
          $appVersion = (dotnet msbuild NetworkChangerApp/NetworkChangerApp.csproj -nologo -getProperty:Version | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            throw "Failed to resolve Version from csproj."
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Publish and package
        shell: pwsh
        run: |
          $appName = "NetworkChangerApp"
          $appVersion = "${{ steps.get_version.outputs.version }}"
          $publishDir = "NetworkChangerApp/bin/Release/net6.0-windows/win-x64/publish"
          $artifactDir = "artifacts"
          $zipPath = "$artifactDir/$appName-$appVersion.zip"

          dotnet publish NetworkChangerApp/NetworkChangerApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugSymbols=false /p:DebugType=None

          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $excludeExtensions = @('.pdb', '.xml')
          $filesToPackage = Get-ChildItem -Path $publishDir -Recurse -File |
            Where-Object { $excludeExtensions -notcontains $_.Extension.ToLowerInvariant() }

          if (-not $filesToPackage) {
            throw "No files found to package in $publishDir"
          }

          Compress-Archive -Path $filesToPackage.FullName -DestinationPath $zipPath -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: artifacts/*.zip

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: artifacts

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: Release v${{ needs.build.outputs.app_version }}
          body: |
            Release of the application
          files: artifacts/*.zip
